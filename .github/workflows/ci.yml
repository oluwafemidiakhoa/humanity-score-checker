name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Syntax check
        run: python -m py_compile core.py server.py tests/mcp_client_smoke.py

      - name: Install runtime
        run: python -m pip install .

      - name: Official MCP client discovery smoke
        run: |
          PORT=8000 python server.py > /tmp/humanity-mcp.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/humanity-mcp.log' EXIT
          python tests/mcp_client_smoke.py http://127.0.0.1:8000/mcp

      - name: Docker build
        run: docker build -t humanity-score-checker:ci .

      - name: Docker runtime official-client smoke
        run: |
          docker run -d --name humanity-score-ci -e PORT=8010 -p 8010:8010 humanity-score-checker:ci
          trap 'docker logs humanity-score-ci || true; docker rm -f humanity-score-ci || true' EXIT
          python tests/mcp_client_smoke.py http://127.0.0.1:8010/mcp
