name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Syntax check
        run: python -m py_compile core.py server.py

      - name: Install runtime
        run: python -m pip install .

      - name: Start MCP server
        run: |
          PORT=8000 python server.py > /tmp/humanity-mcp.log 2>&1 &
          echo $! > /tmp/humanity-mcp.pid
          for i in $(seq 1 30); do
            if python - <<'PY'
import socket
s = socket.socket()
s.settimeout(1)
try:
    s.connect(("127.0.0.1", 8000))
except OSError:
    raise SystemExit(1)
finally:
    s.close()
PY
            then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/humanity-mcp.log
          exit 1

      - name: Official MCP client discovery smoke
        run: |
          python - <<'PY'
import asyncio
from mcp import ClientSession
from mcp.client.streamable_http import streamablehttp_client

async def main():
    async with streamablehttp_client("http://127.0.0.1:8000/mcp") as (read, write, _):
        async with ClientSession(read, write) as session:
            await session.initialize()
            result = await session.list_tools()
            names = {tool.name for tool in result.tools}
            expected = {
                "audit_product",
                "score_product",
                "generate_badge",
                "generate_viral_teardown",
            }
            missing = expected - names
            if missing:
                raise SystemExit(f"Missing tools: {sorted(missing)}")
            print("Detected tools:", sorted(names))

asyncio.run(main())
PY

      - name: Docker build
        run: docker build -t humanity-score-checker:ci .

      - name: Docker runtime official-client smoke
        run: |
          docker run -d --name humanity-score-ci -e PORT=8010 -p 8010:8010 humanity-score-checker:ci
          trap 'docker logs humanity-score-ci || true; docker rm -f humanity-score-ci || true' EXIT
          for i in $(seq 1 30); do
            if python - <<'PY'
import socket
s = socket.socket()
s.settimeout(1)
try:
    s.connect(("127.0.0.1", 8010))
except OSError:
    raise SystemExit(1)
finally:
    s.close()
PY
            then
              break
            fi
            sleep 1
          done
          python - <<'PY'
import asyncio
from mcp import ClientSession
from mcp.client.streamable_http import streamablehttp_client

async def main():
    async with streamablehttp_client("http://127.0.0.1:8010/mcp") as (read, write, _):
        async with ClientSession(read, write) as session:
            await session.initialize()
            result = await session.list_tools()
            names = {tool.name for tool in result.tools}
            expected = {
                "audit_product",
                "score_product",
                "generate_badge",
                "generate_viral_teardown",
            }
            missing = expected - names
            if missing:
                raise SystemExit(f"Missing tools in Docker: {sorted(missing)}")
            print("Docker detected tools:", sorted(names))

asyncio.run(main())
PY
