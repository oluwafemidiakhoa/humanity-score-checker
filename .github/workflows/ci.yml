name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Syntax check
        run: python -m py_compile core.py server.py

      - name: Install runtime
        run: python -m pip install .

      - name: Start MCP server
        run: |
          PORT=8000 python server.py > /tmp/humanity-mcp.log 2>&1 &
          echo $! > /tmp/humanity-mcp.pid
          for i in {1..30}; do
            if python - <<'PY'
import socket
s = socket.socket()
s.settimeout(1)
try:
    s.connect(("127.0.0.1", 8000))
except OSError:
    raise SystemExit(1)
finally:
    s.close()
PY
            then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/humanity-mcp.log
          exit 1

      - name: MCP initialize and tools/list smoke
        run: |
          INIT_RESPONSE=$(curl --fail-with-body -sS             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}'             http://127.0.0.1:8000/mcp)
          echo "$INIT_RESPONSE"
          echo "$INIT_RESPONSE" | grep -q '"result"'

          TOOLS_RESPONSE=$(curl --fail-with-body -sS             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             -H 'MCP-Protocol-Version: 2025-06-18'             -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'             http://127.0.0.1:8000/mcp)
          echo "$TOOLS_RESPONSE"
          echo "$TOOLS_RESPONSE" | grep -q 'audit_product'
          echo "$TOOLS_RESPONSE" | grep -q 'score_product'
          echo "$TOOLS_RESPONSE" | grep -q 'generate_badge'
          echo "$TOOLS_RESPONSE" | grep -q 'generate_viral_teardown'

      - name: Docker build
        run: docker build -t humanity-score-checker:ci .

      - name: Docker runtime smoke
        run: |
          docker run -d --name humanity-score-ci -e PORT=8010 -p 8010:8010 humanity-score-checker:ci
          trap 'docker logs humanity-score-ci || true; docker rm -f humanity-score-ci || true' EXIT
          for i in {1..30}; do
            if curl -sS -o /dev/null               -H 'Content-Type: application/json'               -H 'Accept: application/json, text/event-stream'               -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"docker-smoke","version":"1.0"}}}'               http://127.0.0.1:8010/mcp
            then
              exit 0
            fi
            sleep 1
          done
          exit 1
