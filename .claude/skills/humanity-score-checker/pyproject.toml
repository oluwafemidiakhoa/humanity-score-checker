[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanity-score-checker"
version = "2.0.1"
description = "Evidence-backed human-impact rating for AI products"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Oluwafemi Idiakhoa"}]
dependencies = ["mcp>=1.13,<2"]

[tool.setuptools]
py-modules = ["core", "server"]
